# Construit les applications Windows, macOS et Android.
# - Pousse un tag « v1.0.0 » (ou plus) → une Release GitHub est créée avec tous les installateurs.
# - Lancement manuel (onglet Actions › « Build & Release » › Run workflow) → fichiers disponibles en « Artifacts ».
name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Bureau (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: ''
          - name: macOS Apple Silicon
            platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - name: macOS Intel
            platform: macos-latest
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm install --no-audit --no-fund

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'ASCII Local ${{ github.ref_name }}'
          releaseBody: |
            **Windows** : `.exe` (installateur) ou `.msi`
            **macOS** : `.dmg` — `aarch64` = Mac M1/M2/M3/M4, `x64` = Mac Intel
            **Android** : `ASCII-Local.apk`
            **Web / iPhone** : voir le lien GitHub Pages dans le README.

            Premier lancement : voir la section « Installer » du README (avertissements Windows/macOS normaux pour une appli open source non signée).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Fichiers de test (lancement manuel)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ascii-local-${{ matrix.platform }}-${{ strategy.job-index }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  android:
    name: Android (APK)
    needs: desktop            # attend que la Release soit créée, pour y ajouter l'APK
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm install --no-audit --no-fund

      - name: Créer le projet Android
        run: npx cap add android

      - name: Icônes + permissions (caméra, photos, vidéos)
        run: |
          cp -r src-tauri/icons/android/* android/app/src/main/res/
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../ASCII-Local.apk

      - name: Ajouter l'APK à la Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: ASCII-Local.apk

      - name: Fichier de test (lancement manuel)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ascii-local-android
          path: ASCII-Local.apk
