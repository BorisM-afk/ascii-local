# Construit les applications Windows, macOS et Android, et les publie dans une Release GitHub.
# - Chaque push sur « main » qui touche l'appli met à jour la Release de la version en cours
#   (numéro lu dans src-tauri/tauri.conf.json, ex. 1.0.0 → tag « v1.0.0 », créé automatiquement).
# - Nouvelle version : change "version" dans src-tauri/tauri.conf.json (et package.json), puis pousse.
# - Lancement manuel possible : onglet Actions › « Build & Release » › Run workflow.
name: Build & Release

on:
  push:
    branches: [main]
    paths: ['src/**', 'src-tauri/**', 'package.json', 'capacitor.config.json', '.github/workflows/release.yml']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  desktop:
    name: Bureau (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: ''
          - name: macOS Apple Silicon
            platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - name: macOS Intel
            platform: macos-latest
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm install --no-audit --no-fund

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'ASCII Local v__VERSION__'
          releaseBody: |
            **Windows** : `.exe` (installateur) ou `.msi`
            **macOS** : `.dmg` — `aarch64` = Mac M1/M2/M3/M4, `x64` = Mac Intel
            **Android** : `ASCII-Local.apk`
            **Web / iPhone** : voir le lien GitHub Pages dans le README.

            Premier lancement : voir la section « Installer » du README (avertissements Windows/macOS normaux pour une appli open source non signée).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  android:
    name: Android (APK)
    needs: desktop            # attend que la Release soit créée, pour y ajouter l'APK
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm install --no-audit --no-fund

      - name: Créer le projet Android
        run: npx cap add android

      - name: Icônes + permissions (caméra, photos, vidéos)
        run: |
          cp -r src-tauri/icons/android/* android/app/src/main/res/
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../ASCII-Local.apk

      - name: Version
        id: ver
        run: echo "tag=v$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Ajouter l'APK à la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ASCII Local ${{ steps.ver.outputs.tag }}
          files: ASCII-Local.apk

      - name: APK aussi en « Artifact » (au cas où)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ascii-local-android
          path: ASCII-Local.apk
          if-no-files-found: ignore
